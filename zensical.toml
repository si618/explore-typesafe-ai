[project]
site_url = "https://si618.github.io/explore-typesafe-ai/"
site_name = "Explore TypeSafe AI"
site_description = "Evaluating TypeSafe's System One model Jev on synthetic FHIR clinical scenarios, with Claude as System Two."
# site_author = "Your name"

copyright = "Copyright &copy; 2026 Simon McKenna &mdash; MIT licence"

repo_url = "https://github.com/si618/explore-typesafe-ai"
repo_name = "si618/explore-typesafe-ai"
# edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Prompt & approach" = "prompt.md" },
  { "Synthetic cohort" = "data.md" },
  { "Scenarios" = [
    { "1. Ward deterioration" = "s1-ward.md" },
    { "2. Discharge med reconciliation" = "s2-discharge.md" },
    { "3. Post-discharge inbox" = "s3-inbox.md" },
    { "4. Note search" = "s4-search.md" },
    { "5. ML features" = "s5-features.md" },
  ] },
  { "Generated cases (dev/test)" = "generated.md" },
  { "System Two review" = "system-two.md" },
  { "Independent labels" = "independent-labels.md" },
  { "LLM baseline" = "llm-baseline.md" },
  { "Models, timing & tokens" = "performance.md" },
  { "Vocabulary" = "vocabulary.md" },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
